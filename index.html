<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Expresiones Faciales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Detector de Expresiones</span>
        </div>
    </nav>
    <main class="flex-grow-1 container text-center py-4">
        <h1 class="mb-4 text-primary">Contador de Expresiones Faciales</h1>
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="video-container">
                    <video id="videoInput" autoplay playsinline class="border rounded shadow"></video>
                    <canvas id="canvasOutput" class="mt-3 border rounded shadow"></canvas>
                </div>
            </div>
        </div>
        <div class="mt-4 row justify-content-center">
            <div class="col-sm-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Parpadeos 👀</h5>
                    <p class="card-text h2" id="blinkCount">0</p>
                </div>
            </div>
            <div class="col-sm-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Sonrisas 😊</h5>
                    <p class="card-text h2" id="smileCount">0</p>
                </div>
            </div>
            <div class="col-sm-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Cejas 🤨</h5>
                    <p class="card-text h2" id="browCount">0</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p>Desarrollado por: <strong>Tu Nombre</strong> | © 2025</p>
    </footer>

    <script src="js/app.js"></script>
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
